# AgVim's own kitty windows, the ones its icon and Finder's menu open (lib/terminal).
# It applies on top of your kitty.conf, to these windows only, and doesn't change it.

font_family JetBrainsMono Nerd Font
macos_option_as_alt left

# Closing the last window saves and stops your projects, and they come back.
macos_quit_when_last_window_closed yes
confirm_os_window_close 0
tab_bar_style hidden
macos_titlebar_color background
window_padding_width 0

# ⌘ keys: ⌘3 to tab 3, ⌘O and ⌘B then a number to a project or worktree, ⌘T a shell.
include kitty-keys.conf

# The AgVim menu in the Mac's menu bar. Popups appear over the workspace.
menu_map global "AgVim::Menu…" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup'
menu_map global "AgVim::Open Project…" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup open'
menu_map global "AgVim::New Shell" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" shell'
menu_map global "AgVim::New Tab" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup tab'
menu_map global "AgVim::Rename Project…" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup rename'
menu_map global "AgVim::Delete Project…" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup delete'
menu_map global "AgVim::Close Project" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup close'
menu_map global "AgVim::Refresh" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" refresh'
menu_map global "AgVim::Update…" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" _projects popup update'
menu_map global "AgVim::Show Projects Folder" launch --type=background /bin/zsh -c '"$HOME/.local/bin/agvim" folder'

# Near-black with silver, like Neovim and the tab bars.
background #0a0a0a
foreground #e6e8eb
selection_background #34363b
selection_foreground #ffffff
cursor #c8ccd2
cursor_text_color #0a0a0a
url_color #c8ccd2
color0 #141416
color1 #db627e
color2 #AAD84C
color3 #fdb830
color4 #25B0BC
color5 #da70d6
color6 #6BE4E6
color7 #b4b9c0
color8 #5f646c
color9 #db627e
color10 #AAD84C
color11 #fdb830
color12 #25B0BC
color13 #da70d6
color14 #6BE4E6
color15 #e6e8eb
