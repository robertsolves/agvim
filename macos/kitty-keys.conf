# AgVim's ⌘ keys for kitty. They act only in windows titled AgVim (the projects bar
# names its window "AgVim · <project>", tmux/projects.conf), so in your other kitty
# windows ⌘ keys do what they always did. AgVim's own windows get this through
# macos/kitty.conf; your kitty.conf gets one include line for it (lib/kitty-keys,
# from install.sh; uninstall.sh takes it out).

# ⌘T a new shell tab, ⌘⇧[ / ] the previous / next project (as Alt-Shift-T, [ and ]).
map --when-focus-on 'title:^AgVim\b' cmd+t send_text all \x1bT
map --when-focus-on 'title:^AgVim\b' cmd+shift+[ send_text all \x1b{
map --when-focus-on 'title:^AgVim\b' cmd+shift+] send_text all \x1b}

# Go to what shows a number (tmux.conf, lib/jump), on the row whose numbers are lit:
# ⌘3 is 3, ⌘1 ⌘2 quickly 12, as Alt and the number. ⌘0 lights the next row: tabs,
# worktrees, projects. ⌘O / ⌘B then a number is that project / worktree whatever is
# lit, as Ctrl-Space (\x00) o and b. Not ⌘⇧: macOS takes ⌘⇧3, 4 and 5 for screenshots.
map --when-focus-on 'title:^AgVim\b' cmd+0 send_text all \x1b0
map --when-focus-on 'title:^AgVim\b' cmd+1 send_text all \x1b1
map --when-focus-on 'title:^AgVim\b' cmd+2 send_text all \x1b2
map --when-focus-on 'title:^AgVim\b' cmd+3 send_text all \x1b3
map --when-focus-on 'title:^AgVim\b' cmd+4 send_text all \x1b4
map --when-focus-on 'title:^AgVim\b' cmd+5 send_text all \x1b5
map --when-focus-on 'title:^AgVim\b' cmd+6 send_text all \x1b6
map --when-focus-on 'title:^AgVim\b' cmd+7 send_text all \x1b7
map --when-focus-on 'title:^AgVim\b' cmd+8 send_text all \x1b8
map --when-focus-on 'title:^AgVim\b' cmd+9 send_text all \x1b9
map --when-focus-on 'title:^AgVim\b' cmd+o send_text all \x00o
map --when-focus-on 'title:^AgVim\b' cmd+b send_text all \x00b
