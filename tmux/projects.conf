# The projects bar: the tabs along the top, one per project. It's a small tmux
# server of its own (tmux -L projects, started by lib/projects) whose windows
# each show one project's session of your tmux (~/.tmux.conf), with that
# project's tabs along the bottom. It has no prefix: everything here is mouse
# or one key, and every other key goes through to the project.
#   click a project   show it          x on a project   save it, stop its tabs
#   agvim           always the first tab, with no x: update it from there
#   + Project         open a project   + Shell          a console of its own
#   Alt-Shift-[ / ]   previous / next project
#   < > or the wheel  previous / next project, when they don't all fit

set -g prefix None
set -g prefix2 None
set -g mouse on
set -g focus-events on
set -sg escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g set-clipboard on
set -g allow-passthrough all           # images from Neovim (two tmux deep)
set -g set-titles on
set -g set-titles-string "#W"
set -g history-limit 0                 # scrollback lives in the project's tmux

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys,xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -s extended-keys on
set -s extended-keys-format csi-u

bind -n M-\{ previous-window
bind -n M-\} next-window

# The last window gone (its terminal closed): save every project and stop it, so
# nothing keeps using memory. They come back with `agvim continue` (lib/projects).
set-hook -g client-detached "run-shell -b '~/.local/bin/agvim _projects stop >/dev/null 2>&1; true'"

# Clicks on the bar: a project shows it, its x (range "x<window id>") asks, then
# saves and stops it, + Project opens one or adds a folder (lib/p), + Shell opens a
# console. No right-click menus.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},shell}" {
  run -b "~/.local/bin/agvim shell >/dev/null 2>&1; true"
} {
 if -F "#{==:#{mouse_status_range},new}" {
  display-popup -E -w 80% -h 70% "env -u TMUX ~/.local/bin/agvim _p"
} {
  if -F "#{m:x@*,#{mouse_status_range}}" {
    run -b "~/.local/bin/agvim _projects close '#{client_name}' '#{s/^x//:mouse_status_range}' >/dev/null 2>&1; true"
  } {
    select-window -t =
  }
 }
}
# Too many tabs to fit: the line scrolls to keep the current one in view and
# shows < and > at its ends (status-format). tmux gives those no click range, so
# they're found by position: the > sits just before the 20 cells of the + buttons.
bind -n MouseDown1StatusDefault if -F "#{e|<:#{mouse_x},3}" previous-window {
  if -F "#{&&:#{e|>=:#{mouse_x},#{e|-:#{client_width},23}},#{e|<:#{mouse_x},#{e|-:#{client_width},20}}}" next-window
}
# Mouse in a project goes to the project's tmux (its bottom bar, scrolling,
# selecting). The bar has no copy mode of its own: in one, it would keep the
# clicks.
bind -n MouseDown1Pane select-pane -t = \; send -M
bind -n MouseDrag1Pane send -M
bind -n WheelUpPane send -M
bind -n WheelDownPane send -M
bind -n DoubleClick1Pane send -M
bind -n TripleClick1Pane send -M
bind -n MouseDown3Pane send -M
unbind -q -n MouseDown3Status
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3StatusRight
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q -n M-MouseDown3Pane
unbind -q -n DoubleClick1Status
# The bar must never sit in a mode (copy mode, or the view tmux opens on a
# command's output or failure): a mode keeps every key and click from the
# project. Should one open anyway, the next key or click closes it.
bind -T copy-mode Any send -X cancel
bind -T copy-mode-vi Any send -X cancel

set -g status on
set -g status-position top
set -g status-interval 0
set -g status-style "bg=#141416,fg=#b4b9c0"
# tmux counts the cell after a range's end as part of it, so the x range starts
# on the space before the x: clicks on the x, the space after it and the │ close.
set -g status-format[0] "#[list=on align=left]#[list=left-marker]#[fg=#7f858e] < #[list=right-marker]#[fg=#7f858e] > #[list=on]#[default]#{W:#[range=window|#{window_index}]#[fg=#b4b9c0] #{window_name}#[norange]#{?#{==:#{window_name},agvim}, ,#[range=user|x#{window_id}]#[fg=#7f858e] × #[norange]}#[default]│,#[list=focus]#[range=window|#{window_index}]#[bg=#c8ccd2]#[fg=#141416]#[bold] #{window_name}#[norange]#{?#{==:#{window_name},agvim},#[bg=#c8ccd2] ,#[range=user|x#{window_id}]#[bg=#c8ccd2]#[fg=#141416] × #[norange]}#[default]│#[list=on]}#[nolist]#[range=user|new]#[fg=#7f858e] + Project #[norange]#[range=user|shell]#[fg=#7f858e] + Shell #[norange]#[default]"
set -g pane-border-status off
set -g message-style "bg=#c8ccd2,fg=#141416"
