# The projects bar: the tabs along the top, one per project. It's a small tmux
# server of its own (tmux -L projects, started by lib/projects) whose windows
# each show one project's session of your tmux (~/.tmux.conf), with that
# project's tabs along the bottom. It has no prefix: everything here is mouse
# or one key, and every other key goes through to the project.
#   click a project   show it          its icon         save it, stop its tabs
#   agvim           always the first tab, with no icon: update it from there
#   + Project         open a project   + Shell          a console of its own
#   drag a project    move it          right-click      colour
#   a dot             an agent in that project is waiting for you, or done
#   Alt-Shift-[ / ]   previous / next project
#   Cmd-3             number 3 on the row whose numbers are lit; Cmd-0 lights the next
#                     row (tabs, worktrees, projects); Cmd-O 3 / Cmd-B 3 project or
#                     worktree 3 whatever is lit (the project's tmux has these keys)
#   double-click      a project or worktree gets a *: Left / Right move it, Delete
#                     closes it, r renames a project, any other key is done
#   < > or the wheel  previous / next project, when they don't all fit
# The row under it is the shown project's worktrees (lib/worktree): main, then
# each branch with its own folder and tabs. Click one to show it, its icon to close
# it, + Worktree for a new one, Merge to merge the one shown into main.

set -g prefix None
set -g prefix2 None
set -g mouse on
set -g focus-events on
set -sg escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g automatic-rename off
set -g allow-rename off
set -g set-clipboard on
set -g allow-passthrough all           # images from Neovim (two tmux deep)
set -g set-titles on
set -g set-titles-string "AgVim · #W"
set -g history-limit 0                 # scrollback lives in the project's tmux

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys,xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -s extended-keys on
set -s extended-keys-format csi-u

bind -n M-\{ previous-window
bind -n M-\} next-window

# The last window gone (its terminal closed): save every project and stop it, so
# nothing keeps using memory. They come back with `agvim continue` (lib/projects).
set-hook -g client-detached "run-shell -b '~/.local/bin/agvim _projects stop >/dev/null 2>&1; true'"

# Projects take the next colour in the sequence (lib/colours); showing one clears
# the dot on the tab you see in it (lib/attention). Bells come from the projects
# inside, which handle them themselves.
set-hook -g after-new-window "run-shell -b '~/.local/bin/agvim _colours next bar #{window_id} >/dev/null 2>&1; true'"
set-hook -g session-created "run-shell -b '~/.local/bin/agvim _colours next bar #{window_id} >/dev/null 2>&1; true'"
set-hook -g session-window-changed "run-shell -b '~/.local/bin/agvim _attention sync >/dev/null 2>&1; true'"
setw -g monitor-bell off

# Clicks on the bar: a project shows it, and makes the numbers go to the projects (a
# worktree likewise to the worktrees, lib/jump area); its x (range "x<window id>") asks, then
# saves and stops it, + Project opens one or adds a folder (lib/p), + Shell opens a
# console. On the worktree row below (lib/worktree): a worktree shows it (range
# "w<n>"), its x closes it ("c<n>"), + Worktree makes one, Merge merges the one shown.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},shell}" {
  run -b "~/.local/bin/agvim shell >/dev/null 2>&1; true"
} {
 if -F "#{==:#{mouse_status_range},new}" {
  display-popup -E -w 80% -h 70% "env -u TMUX ~/.local/bin/agvim _p"
 } {
  if -F "#{m:x@*,#{mouse_status_range}}" {
    run -b "~/.local/bin/agvim _projects close '#{client_name}' '#{s/^x//:mouse_status_range}' >/dev/null 2>&1; true"
  } {
   if -F "#{==:#{mouse_status_range},wtnew}" {
    run -b "~/.local/bin/agvim _worktree popup bar '#{client_name}' 70x60 new-here #{q:window_name} >/dev/null 2>&1; true"
   } {
    if -F "#{==:#{mouse_status_range},wtmerge}" {
     run -b "~/.local/bin/agvim _worktree popup bar '#{client_name}' 90x85 merge-here #{q:window_name} >/dev/null 2>&1; true"
    } {
     if -F "#{m:[wc][0-9]*,#{mouse_status_range}}" {
      run -b "~/.local/bin/agvim _worktree click '#{client_name}' #{q:window_name} '#{mouse_status_range}' >/dev/null 2>&1; true"
      if -F "#{&&:#{m:w[0-9]*,#{mouse_status_range}},#{!=:#{@area},worktree}}" {
        run -b "~/.local/bin/agvim _jump area worktree '#{client_name}' >/dev/null 2>&1; true"
      }
     } {
      select-window -t =
      if -F "#{&&:#{==:#{mouse_status_range},window},#{!=:#{@area},project}}" {
        run -b "~/.local/bin/agvim _jump area project '#{client_name}' >/dev/null 2>&1; true"
      }
     }
    }
   }
  }
 }
}
# Too many tabs to fit: the line scrolls to keep the current one in view and
# shows < and > at its ends (status-format). tmux gives those no click range, so
# they're found by position, on the projects row: the > sits just before the 26
# cells of the two + buttons.
bind -n MouseDown1StatusDefault if -F "#{==:#{mouse_status_line},0}" {
  if -F "#{e|<:#{mouse_x},3}" previous-window {
    if -F "#{&&:#{e|>=:#{mouse_x},#{e|-:#{client_width},29}},#{e|<:#{mouse_x},#{e|-:#{client_width},26}}}" next-window
  }
}
# Drag a project along the bar to move it (or double-click it, below); right-click
# for its colour. agvim stays the first tab.
bind -n MouseDrag1Status if -F "#{&&:#{!=:#{active_window_index},1},#{!=:#{window_index},1}}" "swap-window -d -t ="
bind -n MouseDown3Status if -F "#{&&:#{==:#{mouse_status_range},window},#{!=:#{window_name},agvim}}" {
  display-menu -O -T "#[align=centre]#{window_name}" -t = -x M -y W \
    Colour c { run-shell -b "~/.local/bin/agvim _colours menu bar '#{client_name}' '#{window_id}' >/dev/null 2>&1; true" }
}
# Double-click a project: it gets a * (@bar-ed) and, until any other key, Left /
# Right move it, Delete closes it (asks) and r renames it. A worktree the same,
# but its name is its branch (lib/jump). agvim stays first, main too.
bind -n DoubleClick1Status if -F "#{&&:#{==:#{mouse_status_range},window},#{!=:#{window_name},agvim}}" {
  select-window -t = ; switch-client -T bar-edit
} {
  if -F "#{m:w[1-9]*,#{mouse_status_range}}" { switch-client -T wt-edit }
}
bind -T bar-edit Left if -F "#{e|>:#{window_index},2}" "swap-window -d -t :-1" \; switch-client -T bar-edit
bind -T bar-edit Right if -F "#{e|<:#{window_index},#{session_windows}}" "swap-window -d -t :+1" \; switch-client -T bar-edit
bind -T bar-edit BSpace run -b "~/.local/bin/agvim _projects close '#{client_name}' '#{window_id}' >/dev/null 2>&1; true"
bind -T bar-edit DC run -b "~/.local/bin/agvim _projects close '#{client_name}' '#{window_id}' >/dev/null 2>&1; true"
bind -T bar-edit r command-prompt -p "Rename #{window_name}:" {
  set -g @rename-to "%1" ; run -b "~/.local/bin/agvim _jump rename-project '#{client_name}' >/dev/null 2>&1; true"
}
bind -T wt-edit Left run -b "~/.local/bin/agvim _jump wt left '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T wt-edit
bind -T wt-edit Right run -b "~/.local/bin/agvim _jump wt right '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T wt-edit
bind -T wt-edit BSpace run -b "~/.local/bin/agvim _jump wt close '#{client_name}' >/dev/null 2>&1; true"
bind -T wt-edit DC run -b "~/.local/bin/agvim _jump wt close '#{client_name}' >/dev/null 2>&1; true"
bind -T wt-edit r run -b "~/.local/bin/agvim _jump wt rename '#{client_name}' >/dev/null 2>&1; true"
# Mouse in a project goes to the project's tmux (its bottom bar, scrolling,
# selecting). The bar has no copy mode of its own: in one, it would keep the
# clicks.
bind -n MouseDown1Pane select-pane -t = \; send -M
bind -n MouseDrag1Pane send -M
bind -n WheelUpPane send -M
bind -n WheelDownPane send -M
bind -n DoubleClick1Pane send -M
bind -n TripleClick1Pane send -M
bind -n MouseDown3Pane send -M
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3StatusRight
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q -n M-MouseDown3Pane
# The bar must never sit in a mode (copy mode, or the view tmux opens on a
# command's output or failure): a mode keeps every key and click from the
# project. Should one open anyway, the next key or click closes it.
bind -T copy-mode Any send -X cancel
bind -T copy-mode-vi Any send -X cancel

# The theme's 16 terminal colours (tmux.conf has the same until Neovim sets them).
%if "#{==:#{@c4},}"
set -g @c0 "#3a3d42"
set -g @c1 "#e06c75"
set -g @c2 "#98c379"
set -g @c3 "#e5c07b"
set -g @c4 "#61afef"
set -g @c5 "#c678dd"
set -g @c6 "#56b6c2"
set -g @c7 "#abb2bf"
set -g @c8 "#5f646c"
set -g @c9 "#f28b82"
set -g @c10 "#a8e6a1"
set -g @c11 "#f9e2af"
set -g @c12 "#89b4fa"
set -g @c13 "#f5c2e7"
set -g @c14 "#94e2d5"
set -g @c15 "#e6e8eb"
%endif

set -g status 3
set -g status-position top
set -g status-interval 10
set -g status-style "bg=#141416,fg=#b4b9c0"
# Three rows: the projects (a row and a half tall: the half is a row of upper half
# blocks that repeats every tab, button and gap of the row above in its colour, so
# they are as tall as the bar, with the filler counted from @bar-tabs-m), and under the line where the colour changes, the
# worktrees of the project shown (@wt, written by lib/worktree).
# A project's name is in its own colour (@fg, lib/colours), after a dot that shows
# what its tabs are doing (@agent-state, lib/attention). tmux counts the cell after a
# range's end as part of it, so the x range starts on the space before the x.
set -g @bar-fg "#{?#{@fg},#{@fg},#b4b9c0}"
# The project shown, double-clicked: a * after its name while its keys are on (bar-edit).
set -g @bar-ed "#{?#{&&:#{window_active},#{==:#{client_key_table},bar-edit}},*,}"
# Its number, to go to it with Cmd and the number while numbers go to projects (@area,
# lib/jump: then they're lit, dark on light), or Cmd-O and the number; and as blocks.
set -g @bar-num "#{?#{==:#{@area},project},#[fg=#141416]#[bg=#e6e8eb]#{window_index}#[bg=#{?window_active,#34363b,#141416}],#[fg=#7f858e]#{window_index}} "
set -g @bar-num-m "#{s/./▀/:#{window_index}}▀"
# Same dot as the tabs below, for the busiest state among the project's tabs.
set -g @bar-dot "#{?#{==:#{@agent-state},working},#[fg=#7fbf7f],#{?#{==:#{@agent-state},waiting},#[fg=#e5a54b],#{?#{==:#{@agent-state},done},#[fg=#61afef],#[fg=#5f646c]}}}● "
# The tabs of the row above as plain blocks, to count how many cells they take.
set -g @bar-tabs-m "#{W:▀▀▀#{E:@bar-num-m}#{s/./▀/:window_name}#{s/./▀/:#{E:@bar-ed}}#{?#{==:#{window_name},agvim},▀,▀▀▀▀}▀,▀▀▀#{E:@bar-num-m}#{s/./▀/:window_name}#{s/./▀/:#{E:@bar-ed}}#{?#{==:#{window_name},agvim},▀,▀▀▀▀}▀}"
set -g status-format[0] "#[list=on align=left]#[list=left-marker]#[fg=#7f858e] < #[list=right-marker]#[fg=#7f858e] > #[list=on]#[default]#{W:#[range=window|#{window_index}] #{E:@bar-num}#{E:@bar-dot}#[fg=#{E:@bar-fg}]#{window_name}#[norange]#{?#{==:#{window_name},agvim}, ,#[range=user|x#{window_id}]#[fg=#5f646c] 󰅖  #[norange]}#[fg=#3a3d42]│#[default],#[list=focus]#[range=window|#{window_index}]#[bg=#34363b] #{E:@bar-num}#{E:@bar-dot}#[fg=#{E:@bar-fg}]#[bold]#{window_name}#{E:@bar-ed}#[nobold]#[norange]#{?#{==:#{window_name},agvim},#[bg=#34363b] ,#[range=user|x#{window_id}]#[bg=#34363b]#[fg=#c8ccd2] 󰅖  #[norange]}#[default]#[fg=#3a3d42]│#[default]#[list=on]}#[nolist] #[range=user|new]#[fg=#2c2e33]#[bg=#2c2e33,fg=#e6e8eb] + Project #[bg=#141416,fg=#2c2e33]#[norange] #[range=user|shell]#[fg=#2c2e33]#[bg=#2c2e33,fg=#e6e8eb] + Shell #[bg=#141416,fg=#2c2e33]#[norange]#[default]"
set -g status-format[1] "#[list=on align=left]#[list=left-marker]#[fg=#141416]#[bg=#202226]▀▀▀#[list=right-marker]#[fg=#141416]#[bg=#202226]▀▀▀#[list=on]#{W:#[range=window|#{window_index}]#[fg=#141416]#[bg=#202226]▀▀▀#{E:@bar-num-m}#{s/./▀/:window_name}#{?#{==:#{window_name},agvim},▀,#[range=user|x#{window_id}]▀▀▀▀#[norange]}#[fg=#141416]▀#[norange],#[list=focus]#[range=window|#{window_index}]#[fg=#34363b]#[bg=#202226]▀▀▀#{E:@bar-num-m}#{s/./▀/:window_name}#{s/./▀/:#{E:@bar-ed}}#{?#{==:#{window_name},agvim},▀,#[range=user|x#{window_id}]▀▀▀▀#[norange]}#[fg=#141416]▀#[norange]#[list=on]}#[nolist]#[fg=#141416]#[bg=#202226]▀#[range=user|new]#[fg=#2c2e33]#[bg=#202226]▀▀▀▀▀▀▀▀▀▀▀#[norange]#[fg=#141416]#[bg=#202226]▀#[range=user|shell]#[fg=#2c2e33]#[bg=#202226]▀▀▀▀▀▀▀▀▀#[norange]#[fg=#141416]#[bg=#202226]#{?#{e|>:#{e|-:#{client_width},#{e|+:#{e|/:#{n:#{E:@bar-tabs-m}},3},22}},0},#{R:▀,#{e|-:#{client_width},#{e|+:#{e|/:#{n:#{E:@bar-tabs-m}},3},22}}},}"
set -g status-format[2] "#[bg=#202226,fg=#b4b9c0]#{E:@wt}#[align=right]#{E:@wt-right}"
set -g pane-border-status off
set -g message-style "bg=#c8ccd2,fg=#141416"
