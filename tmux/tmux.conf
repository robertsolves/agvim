# tmux: keeps terminal sessions alive in the background, split into panes and
# windows. Cheat sheet (prefix = Ctrl-Space, press it, let go, then the key):
#   bottom line           this project's tabs, each full screen: nvim, shell 1,
#                         shell 2... Click one to show it, its icon to close it,
#                         + Shell for a new one; drag to move it; right-click to
#                         rename it or change its colour. With too many to fit,
#                         < > or the wheel move along them. An agent's tab shows
#                         its session's name, and a dot when it's waiting for you
#                         or done. Projects and worktrees are the rows on top
#                         (tmux/projects.conf).
#   Alt-Shift-Left/Right  move this tab left / right
#   double-click a tab    it gets a *: Left / Right move it, Delete closes it,
#                         r renames it, any other key is done
#   Cmd-3 / Cmd-1 Cmd-2   go to number 3, or 12 (the second quickly), on the row
#                         whose numbers are lit; also prefix 3 / prefix 1 2, Alt-3
#   Cmd-0 / prefix 0      light the next row: tabs, worktrees, projects, tabs...
#   Cmd-B 2 / Cmd-O 2     go to worktree 2 / project 2, whatever row is lit; also
#                         prefix b 2 / prefix o 2
#   Alt-Shift-B / prefix w  a new worktree (a branch in a folder of its own)
#   prefix m              merge the worktree you're in (merge, squash or PR)
#   prefix a              every running agent, in every project: Enter goes there
#   Alt-t / Alt-. / Alt-, new shell tab / next / previous tab
#   prefix |  /  prefix - split side by side / top and bottom
#   Ctrl-h/j/k/l          move between panes AND Neovim splits
#   prefix c / n / p      new tab / next / previous
#   prefix s / P          open a project, or add a folder   prefix z   zoom a pane
#   prefix [              scroll/copy mode (v select, y copy, q quit)
#   prefix r              reload this file
#   agvim               (in any shell) the wizard; agvim help lists the commands
#   agvim name <text>   rename the tab you're in
#   prefix g              all git changes of this folder in a popup (q closes)

# Prefix: Ctrl-Space instead of Ctrl-b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g focus-events on                 # Neovim autoread/auto-save need this
set -sg escape-time 10                 # no lag after Esc in Neovim
set -g history-limit 100000
set -g base-index 1                    # windows start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on            # images and OSC sequences from apps
set -g allow-set-title on              # agents name their session in the title

# True colour and undercurls (Neovim diagnostics).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB,tmux-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass keys like Ctrl-Enter and Shift-F5 through to Neovim.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-kitty:extkeys,tmux-256color:extkeys'

# Splits open in the folder of the pane they split.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# new-shell: a full-screen shell tab in the project folder (lib/tab).
set -s command-alias[100] "new-shell=run-shell -b \"~/.local/bin/agvim _tab new '#{session_id}' >/dev/null 2>&1; true\""
bind c new-shell
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind P display-popup -E -w 80% -h 70% "~/.local/bin/agvim _p"
bind s display-popup -E -w 80% -h 70% "~/.local/bin/agvim _p"
bind a display-popup -E -w 90% -h 60% "~/.local/bin/agvim _running"
# tmux doesn't expand #{...} in a popup's command, only in run-shell: so these ask
# lib/worktree to open the popup, with the session's name filled in.
bind w run-shell -b "~/.local/bin/agvim _worktree popup work '#{client_name}' 80x50 new -P '#{session_name}' >/dev/null 2>&1; true"
bind -n M-B run-shell -b "~/.local/bin/agvim _worktree popup work '#{client_name}' 80x50 new -P '#{session_name}' >/dev/null 2>&1; true"
bind m run-shell -b "~/.local/bin/agvim _worktree popup work '#{client_name}' 90x85 merge -P '#{session_name}' >/dev/null 2>&1; true"
bind g display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "~/.local/bin/agvim _gd"   # prefix g: all git changes

# Ctrl-Space then a number goes to the tab, worktree or project showing it, on the
# row the numbers are lit on (@area: Ctrl-Space 0 or Cmd-0 moves it along, lib/jump);
# two digits quickly for 10 and up (Ctrl-Space 1 2). b or o before the number: that
# worktree or project whatever row is lit. -r keeps tmux in the next table for
# repeat-time, so a digit within it is the second one; after it, keys are typed.
set -g repeat-time 500
bind -r 1 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 1 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 1 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 2 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 2 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 2 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 3 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 3 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 3 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 4 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 4 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 4 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 5 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 5 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 5 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 6 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 6 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 6 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 7 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 7 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 7 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 8 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 8 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 8 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r 9 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 9 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 9 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind b set -g @jump-level worktree \; switch-client -T jump
bind o set -g @jump-level project \; switch-client -T jump
bind -r -T jump 1 set -g @jump 1 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 1 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 2 set -g @jump 2 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 2 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 3 set -g @jump 3 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 3 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 4 set -g @jump 4 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 4 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 5 set -g @jump 5 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 5 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 6 set -g @jump 6 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 6 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 7 set -g @jump 7 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 7 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 8 set -g @jump 8 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 8 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump 9 set -g @jump 9 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 9 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -T jump2 0 set -gF @jump "#{@jump}0" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 1 set -gF @jump "#{@jump}1" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 2 set -gF @jump "#{@jump}2" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 3 set -gF @jump "#{@jump}3" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 4 set -gF @jump "#{@jump}4" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 5 set -gF @jump "#{@jump}5" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 6 set -gF @jump "#{@jump}6" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 7 set -gF @jump "#{@jump}7" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 8 set -gF @jump "#{@jump}8" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 9 set -gF @jump "#{@jump}9" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root

# Cmd-1..9 (kitty sends them as Alt-1..9, macos/kitty-keys.conf) the same: Cmd-3 is
# 3, Cmd-1 Cmd-2 quickly 12, Cmd-1 Cmd-0 10. Cmd-0 moves the lit row along.
bind -r -n M-1 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 1 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 1 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-2 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 2 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 2 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-3 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 3 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 3 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-4 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 4 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 4 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-5 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 5 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 5 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-6 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 6 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 6 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-7 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 7 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 7 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-8 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 8 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 8 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -r -n M-9 set -gF @jump-level "#{?@area,#{@area},tab}" \; set -g @jump 9 \; run -b "~/.local/bin/agvim _jump first #{@jump-level} 9 '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T jump2
bind -n M-0 run -b "~/.local/bin/agvim _jump area '#{client_name}' >/dev/null 2>&1; true"
bind 0 run -b "~/.local/bin/agvim _jump area '#{client_name}' >/dev/null 2>&1; true"
bind -r -T jump2 M-0 set -gF @jump "#{@jump}0" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-1 set -gF @jump "#{@jump}1" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-2 set -gF @jump "#{@jump}2" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-3 set -gF @jump "#{@jump}3" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-4 set -gF @jump "#{@jump}4" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-5 set -gF @jump "#{@jump}5" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-6 set -gF @jump "#{@jump}6" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-7 set -gF @jump "#{@jump}7" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-8 set -gF @jump "#{@jump}8" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root
bind -r -T jump2 M-9 set -gF @jump "#{@jump}9" \; run -b "~/.local/bin/agvim _jump go #{@jump-level} #{@jump} '#{client_name}' >/dev/null 2>&1; true" \; switch-client -T root

# Tabs along the bottom: full-screen windows of the project.
bind -n M-t new-shell
bind -n M-T new-shell
bind -n M-. next-window
bind -n M-, previous-window
# Alt-g (git changes in Neovim) from any tab of the project.
bind -n M-g if -F "#{==:#{pane_current_command},nvim}" "send-keys M-g" "select-window -t :nvim ; send-keys -t :nvim M-g"

# Clicks on the tab line: a tab shows it, and the numbers go to the tabs; its x (range "x<window id>") asks,
# then closes it (lib/tab); "+ Shell" adds a shell. Right-click a tab to rename,
# colour, move or close it (Close asks, like the x, and takes a folder's tab
# out of the project). Elsewhere right-click goes to the app (Neovim, lazygit), no menu.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},new}" "new-shell" {
  if -F "#{m:x@*,#{mouse_status_range}}" {
    run -b "~/.local/bin/agvim _tab close '#{client_name}' '#{s/^x//:mouse_status_range}' >/dev/null 2>&1; true"
  } {
    select-window -t =
    # Clicking a tab makes the numbers go to the tabs, lit (lib/jump area).
    if -F "#{&&:#{==:#{mouse_status_range},window},#{m/r:^(worktree|project)$,#{@area}}}" {
      run -b "~/.local/bin/agvim _jump area tab '#{client_name}' >/dev/null 2>&1; true"
    }
  }
}
# Too many tabs to fit: the line scrolls to keep the current one in view and
# shows < and > at its ends (status-format). tmux gives those no click range, so
# they're found by position, on the tab row: the < just after a worktree's branch
# (@tab-wt), the > just before the 12 cells of the + Shell button.
bind -n MouseDown1StatusDefault if -F "#{==:#{mouse_status_line},1}" {
  if -F "#{&&:#{e|>=:#{mouse_x},#{E:@tab-wt-w}},#{e|<:#{mouse_x},#{e|+:#{E:@tab-wt-w},3}}}" previous-window {
    if -F "#{&&:#{e|>=:#{mouse_x},#{e|-:#{client_width},15}},#{e|<:#{mouse_x},#{e|-:#{client_width},12}}}" next-window
  }
}
# Drag a tab along the bar to move it, or Alt-Shift-Left / Right. The order is
# saved with the project. -d keeps the moved tab the one shown (without it, tmux
# shows whatever took its place).
bind -n MouseDrag1Status swap-window -d -t =
bind -n M-S-Left swap-window -d -t :-1
bind -n M-S-Right swap-window -d -t :+1
# Right-click a tab: rename it or change its colour (double-click it to move or close
# it). Rename starts empty, so you type the new name; Enter on nothing keeps the old one.
bind -n MouseDown3Status if -F "#{==:#{mouse_status_range},window}" {
  display-menu -O -T "#[align=centre]#{window_name}" -t = -x M -y W \
    Rename r { command-prompt -p "Rename #{window_name}:" { rename-window -t "#{window_id}" "%1" ; if -F -t "#{window_id}" "##{window_name}" { set-option -w -t "#{window_id}" @named 1 } { rename-window -t "#{window_id}" "#{q:window_name}" } } } \
    Colour c { run-shell -b "~/.local/bin/agvim _colours menu work '#{client_name}' '#{window_id}' >/dev/null 2>&1; true" }
}
# Double-click a tab: a * after its name (@tab-label) and, until any other key,
# Left / Right move it, Delete closes it (asks) and r renames it.
bind -n DoubleClick1Status if -F "#{==:#{mouse_status_range},window}" { select-window -t = ; switch-client -T tab-edit }
bind -T tab-edit Left if -F "#{e|>:#{window_index},1}" "swap-window -d -t :-1" \; switch-client -T tab-edit
bind -T tab-edit Right if -F "#{e|<:#{window_index},#{session_windows}}" "swap-window -d -t :+1" \; switch-client -T tab-edit
bind -T tab-edit BSpace run -b "~/.local/bin/agvim _tab close '#{client_name}' '#{window_id}' >/dev/null 2>&1; true"
bind -T tab-edit DC run -b "~/.local/bin/agvim _tab close '#{client_name}' '#{window_id}' >/dev/null 2>&1; true"
bind -T tab-edit r command-prompt -p "Rename #{window_name}:" {
  set -g @rename-to "%1" ; run -b "~/.local/bin/agvim _jump rename-tab '#{window_id}' '#{client_name}' >/dev/null 2>&1; true"
}
bind -n MouseDown3Pane if -F -t= "#{||:#{mouse_any_flag},#{pane_in_mode}}" "select-pane -t= ; send -M" "select-pane -t="
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3StatusRight
unbind -q -n M-MouseDown3Pane
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q Space

# Resize panes with prefix + H/J/K/L (hold to repeat).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim keys in copy mode; y copies to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Ctrl-h/j/k/l move between panes, or between Neovim splits when Neovim has
# focus (pairs with christoomey/vim-tmux-navigator in the Neovim config).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# The shell's Ctrl-l (clear screen) moves to prefix Ctrl-l.
bind C-l send-keys C-l

# Changes to the tabs are saved within seconds, so a crash or power cut loses
# nothing (lib/project save-soon waits a moment and saves once).
set-hook -g window-linked "run-shell -b '~/.local/bin/agvim _project save-soon #{q:session_name} >/dev/null 2>&1; true'"
set-hook -g window-unlinked "run-shell -b '~/.local/bin/agvim _project save-soon #{q:session_name} >/dev/null 2>&1; true'"
set-hook -g window-renamed "run-shell -b '~/.local/bin/agvim _project save-soon #{q:session_name} >/dev/null 2>&1; true'"
set-hook -g after-split-window "run-shell -b '~/.local/bin/agvim _project save-soon #{q:session_name} >/dev/null 2>&1; true'"

# A new tab takes the next colour in the sequence (lib/colours).
set-hook -g after-new-window "run-shell -b '~/.local/bin/agvim _colours next work #{window_id} >/dev/null 2>&1; true'"
set-hook -g session-created "run-shell -b '~/.local/bin/agvim _colours next work #{window_id} >/dev/null 2>&1; true'"

# An agent that rings the bell in a tab you aren't looking at, or tells Claude's
# hooks it's waiting or done, gets a dot on its tab and on its project in the bar
# (lib/attention). Showing the tab clears it.
setw -g monitor-bell on
set -g bell-action other
set -g visual-bell off
set-hook -g alert-bell "run-shell -b '~/.local/bin/agvim _attention bell #{window_id} >/dev/null 2>&1; true'"
set-hook -g session-window-changed "run-shell -b '~/.local/bin/agvim _attention sync >/dev/null 2>&1; true'"
set-hook -g client-session-changed "run-shell -b '~/.local/bin/agvim _attention sync >/dev/null 2>&1; true'"

# The theme's 16 terminal colours, for the tabs' names (lib/colours). Neovim sets
# them from its theme as it starts; these are for until it has.
%if "#{==:#{@c4},}"
set -g @c0 "#3a3d42"
set -g @c1 "#e06c75"
set -g @c2 "#98c379"
set -g @c3 "#e5c07b"
set -g @c4 "#61afef"
set -g @c5 "#c678dd"
set -g @c6 "#56b6c2"
set -g @c7 "#abb2bf"
set -g @c8 "#5f646c"
set -g @c9 "#f28b82"
set -g @c10 "#a8e6a1"
set -g @c11 "#f9e2af"
set -g @c12 "#89b4fa"
set -g @c13 "#f5c2e7"
set -g @c14 "#94e2d5"
set -g @c15 "#e6e8eb"
%endif

# Status bar along the bottom: half a row of padding, then the project's tabs and
# + Shell. A tab's name is in its own colour (@fg, lib/colours), after a dot: grey
# nothing, green working, amber waiting, blue done (@agent-state, lib/attention). A tab
# running a program that set a title (Claude's session name, Gemini's...) shows
# that title, without a leading spinner; otherwise the tab's name. A name you gave
# it (@named: agvim name, right-click, Space tr) always wins.
set -g @tab-label "#{?#{@named},#{window_name},#{?#{&&:#{!=:#{pane_title},#{host}},#{&&:#{!=:#{window_name},nvim},#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},0,1}}},#{=/28/…:#{s/^[^A-Za-z0-9]+//:pane_title}},#{window_name}}}#{?#{&&:#{window_active},#{==:#{client_key_table},tab-edit}},*,}"
# The dot is always there, so a tab never changes width: grey nothing, green working,
# amber waiting for you, blue done (@agent-state, lib/attention).
set -g @tab-dot "#{?#{==:#{@agent-state},working},#[fg=#7fbf7f],#{?#{==:#{@agent-state},waiting},#[fg=#e5a54b],#{?#{==:#{@agent-state},done},#[fg=#61afef],#[fg=#5f646c]}}}● "
set -g @tab-fg "#{?#{@fg},#{@fg},#b4b9c0}"
# Its number, to go to it with Cmd or Ctrl-Space and the number, and the same as
# blocks. Lit (dark on light) while numbers go to tabs (@area, lib/jump), so you can
# see which row they're on; then the tab's own background again.
set -g @tab-num "#{?#{m/r:^(worktree|project)$,#{@area}},#[fg=#7f858e]#{window_index},#[fg=#0a0a0a]#[bg=#e6e8eb]#{window_index}#[bg=#{?window_active,#34363b,#1a1b1e}]} "
set -g @tab-num-m "#{s/./▄/:#{window_index}}▄"
# In a worktree (lib/worktree sets @branch on its session) the tabs start with its
# branch: they're often named as main's, so this is how you tell them apart. Then
# the same as blocks for the row above, and how many cells it takes (0 in main).
set -g @tab-wt "#{?#{@branch},#[fg=#7f858e]  ⎇ #[fg=#e6e8eb]#{@branch} #[fg=#3a3d42]│#[default],}"
set -g @tab-wt-m "#{?#{@branch},▄▄▄▄#{s/./▄/:#{@branch}}▄▄,}"
set -g @tab-wt-w "#{e|/:#{n:#{E:@tab-wt-m}},3}"
# Shells match Neovim's near-black theme, whatever the terminal around them looks like.
set -g window-style "bg=#0a0a0a,fg=#e6e8eb"
set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b1e,fg=#b4b9c0"
# The bar is a row and a half tall: a terminal can't draw half a row of text, so
# the top half is a row of lower half blocks that repeats every tab and button of
# the row below in its colour, so they are as tall as the bar.
# The branch and tabs of the row below as plain blocks, to count how many cells they take.
set -g @tab-m "#{E:@tab-wt-m}#{W:▄▄▄▄#{E:@tab-num-m}#{s/./▄/:#{E:@tab-label}}▄▄▄▄▄,▄▄▄▄#{E:@tab-num-m}#{s/./▄/:#{E:@tab-label}}▄▄▄▄▄}"
set -g status-format[0] "#[align=left]#[fg=#1a1b1e]#[bg=#0a0a0a]#{E:@tab-wt-m}#[list=on align=left]#[list=left-marker]#[fg=#1a1b1e]#[bg=#0a0a0a]▄▄▄#[list=right-marker]#[fg=#1a1b1e]#[bg=#0a0a0a]▄▄▄#[list=on]#{W:#[range=window|#{window_index}]#[fg=#1a1b1e]#[bg=#0a0a0a]▄▄▄▄#{E:@tab-num-m}#{s/./▄/:#{E:@tab-label}}#[norange]#[range=user|x#{window_id}]▄▄▄▄▄#[norange],#[list=focus]#[range=window|#{window_index}]#[fg=#34363b]#[bg=#0a0a0a]▄▄▄▄#{E:@tab-num-m}#{s/./▄/:#{E:@tab-label}}#[norange]#[range=user|x#{window_id}]▄▄▄▄▄#[norange]#[list=on]}#[nolist]#[fg=#1a1b1e]#[bg=#0a0a0a]▄#[range=user|new]#[fg=#2c2e33]#[bg=#0a0a0a]▄▄▄▄▄▄▄▄▄#[norange]#[fg=#1a1b1e]#[bg=#0a0a0a]#{?#{e|>:#{e|-:#{client_width},#{e|+:#{e|/:#{n:#{E:@tab-m}},3},10}},0},#{R:▄,#{e|-:#{client_width},#{e|+:#{e|/:#{n:#{E:@tab-m}},3},10}}},}"
# tmux counts the cell after a range's end as part of it, so the x range starts
# on the space before the x: clicks on the x and the two cells after it close.
# + Shell is a button: a lighter box.
set -g status-format[1] "#[align=left]#{E:@tab-wt}#[list=on align=left]#[list=left-marker]#[fg=#7f858e] < #[list=right-marker]#[fg=#7f858e] > #[list=on]#[default]#{W:#[range=window|#{window_index}]  #{E:@tab-num}#{E:@tab-dot}#[fg=#{E:@tab-fg}]#{E:@tab-label}#[norange]#[range=user|x#{window_id}]#[fg=#5f646c] 󰅖   #[norange]#[default],#[list=focus]#[range=window|#{window_index}]#[bg=#34363b]  #{E:@tab-num}#{E:@tab-dot}#[fg=#{E:@tab-fg}]#[bold]#{E:@tab-label}#[nobold]#[norange]#[range=user|x#{window_id}]#[bg=#34363b]#[fg=#c8ccd2] 󰅖   #[norange]#[default]#[list=on]}#[nolist] #[range=user|new]#[fg=#2c2e33]#[bg=#2c2e33,fg=#e6e8eb] + Shell #[bg=#1a1b1e,fg=#2c2e33]#[norange]#[default]"
set -g pane-border-status off
set -g pane-border-style "fg=#3a3d42"
set -g pane-active-border-style "fg=#c8ccd2"
set -g message-style "bg=#c8ccd2,fg=#1a1b1e"
