# tmux: keeps terminal sessions alive in the background, split into panes and
# windows. Cheat sheet (prefix = Ctrl-Space, press it, let go, then the key):
#   tmux new -s work      start a session called "work"
#   tmux a -t work        reattach later (even after closing the terminal)
#   prefix d              detach (session keeps running)
#   bottom line           this project's tabs, each full screen: nvim, shell 1,
#                         shell 2... Click one to show it, x to close it, + for a
#                         new shell; right-click to rename. An agent's tab shows
#                         its session's name. Projects are the tabs on top
#                         (tmux/projects.conf).
#   Alt-t / Alt-. / Alt-, new shell tab / next / previous tab
#   prefix |  /  prefix - split side by side / top and bottom
#   Ctrl-h/j/k/l          move between panes AND Neovim splits
#   prefix c / n / p      new tab / next / previous (also Alt-1..9)
#   prefix s / P          pick a project to open      prefix z   zoom a pane
#   prefix Ctrl-s / Ctrl-r  save / restore every project (also every 5 min / on start)
#   prefix [              scroll/copy mode (v select, y copy, q quit)
#   prefix r              reload this file
#   t / p                 (in the shell) workspace for this folder / pick a project
#   prefix g              all git changes of this folder in a popup (q closes)

# Prefix: Ctrl-Space instead of Ctrl-b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g focus-events on                 # Neovim autoread/auto-save need this
set -sg escape-time 10                 # no lag after Esc in Neovim
set -g history-limit 100000
set -g base-index 1                    # windows start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on            # images and OSC sequences from apps
set -g allow-set-title on              # agents name their session in the title

# True colour and undercurls (Neovim diagnostics) in kitty and other terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB,tmux-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass keys like Ctrl-Enter and Shift-F5 through to Neovim.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-kitty:extkeys,tmux-256color:extkeys'

# Splits and new windows open in the project folder.
bind | split-window -h -c "#{session_path}"
bind - split-window -v -c "#{session_path}"
# new-shell: a full-screen shell tab in the project folder (bin/tab).
set -s command-alias[100] "new-shell=run-shell -b \"~/.local/bin/tab new '#{session_id}'\""
bind c new-shell
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind P display-popup -E -w 80% -h 70% "~/.local/bin/p"
bind s display-popup -E -w 80% -h 70% "~/.local/bin/p"
bind g display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "~/.local/bin/gd"   # prefix g: all git changes

# Alt-1..9 jump straight to a window.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Tabs along the bottom: full-screen windows of the project. Kitty's Cmd-T sends
# Alt-T here, so it opens a shell tab instead of an empty kitty tab.
bind -n M-t new-shell
bind -n M-T new-shell
bind -n M-. next-window
bind -n M-, previous-window
# Alt-g (git changes in Neovim) from any tab of the project.
bind -n M-g if -F "#{==:#{window_name},nvim}" "send-keys M-g" "select-window -t :nvim ; send-keys -t :nvim M-g"

# Clicks on the tab line: a tab shows it; its x (range "x<window id>") asks,
# then closes it (bin/tab); "+" adds a shell. Right-click a tab to rename or
# close it. Elsewhere right-click goes to the app (Neovim, lazygit), no menu.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},new}" "new-shell" {
  if -F "#{m:x@*,#{mouse_status_range}}" {
    run -b "~/.local/bin/tab close '#{client_name}' '#{s/^x//:mouse_status_range}'"
  } {
    select-window -t =
  }
}
bind -n MouseDown3Status if -F "#{==:#{mouse_status_range},window}" {
  display-menu -O -T "#[align=centre]#{window_name}" -t = -x M -y W \
    Rename r { command-prompt -I "#{window_name}" -p "Name:" { rename-window -t "#{window_id}" "%%" } } \
    Close x { confirm-before -p "Close #{window_name}? (y/n)" { kill-window -t "#{window_id}" } } \
    "" \
    "Close project" q { confirm-before -p "Close #{session_name} and all its tabs? (y/n)" { kill-session -t "=#{session_name}" ; run-shell -b ~/.tmux/plugins/tmux-resurrect/scripts/save.sh } }
}
bind -n MouseDown3Pane if -F -t= "#{||:#{mouse_any_flag},#{pane_in_mode}}" "select-pane -t= ; send -M" "select-pane -t="
unbind -q -n MouseDown3StatusLeft
unbind -q -n MouseDown3StatusRight
unbind -q -n M-MouseDown3Pane
unbind -q -n M-MouseDown3Status
unbind -q -n M-MouseDown3StatusLeft
unbind -q Space

# Resize panes with prefix + H/J/K/L (hold to repeat).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim keys in copy mode; y copies to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Ctrl-h/j/k/l move between panes, or between Neovim splits when Neovim has
# focus (pairs with christoomey/vim-tmux-navigator in the Neovim config).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# The shell's Ctrl-l (clear screen) moves to prefix Ctrl-l.
bind C-l send-keys C-l

# Status bar: one line at the bottom with the project's tabs, then "+". A tab
# running a program that set a title (Claude's session name, Gemini's...) shows
# that title, without a leading spinner; otherwise the tab's name.
set -g @tab-label "#{?#{&&:#{!=:#{pane_title},#{host}},#{&&:#{!=:#{window_name},nvim},#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},0,1}}},#{=/28/…:#{s/^[^A-Za-z0-9]+//:pane_title}},#{window_name}}"
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1d2433,fg=#aeb7c6"
set -g status-format[0] "#{W:#[range=window|#{window_index}]#[fg=#aeb7c6] #{E:@tab-label} #[norange]#[range=user|x#{window_id}]#[fg=#7f8ea3]× #[norange]#[default] ,#[range=window|#{window_index}]#[bg=#c177e5]#[fg=#1d2433]#[bold] #{E:@tab-label} #[norange]#[range=user|x#{window_id}]#[bg=#c177e5]#[fg=#1d2433]× #[norange]#[default] }#[range=user|new]#[fg=#7f8ea3] + #[norange]#[default]"
set -g pane-border-status off
set -g pane-border-style "fg=#2e3a4f"
set -g pane-active-border-style "fg=#44a8e5"
set -g message-style "bg=#c177e5,fg=#1d2433"

# Plugins (TPM). prefix I installs new ones, prefix U updates them.
#   tmux-resurrect: prefix Ctrl-s saves all sessions, prefix Ctrl-r restores them.
#   tmux-continuum: saves every 5 minutes and restores every project when tmux
#   next starts (after closing kitty, a crash or a reboot) by itself.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
# Agents come back too, each continuing its last conversation in the project folder.
set -g @resurrect-processes 'lazygit "~claude->claude --continue" "~codex->codex resume --last" "~opencode->opencode --continue" "~kilo->kilo --continue" "~gemini->gemini --resume latest" "~freebuff->freebuff --continue"'
run '~/.tmux/plugins/tpm/tpm'
