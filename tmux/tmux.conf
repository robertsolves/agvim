# tmux: keeps terminal sessions alive in the background, split into panes and
# windows. Cheat sheet (prefix = Ctrl-Space, press it, let go, then the key):
#   tmux new -s work      start a session called "work"
#   tmux a -t work        reattach later (even after closing the terminal)
#   prefix d              detach (session keeps running)
#   prefix |  /  prefix - split side by side / top and bottom
#   Ctrl-h/j/k/l          move between panes AND Neovim splits
#   prefix c / n / p      new window / next / previous (also Alt-1..9)
#   prefix s              pick a session        prefix z   zoom a pane
#   prefix [              scroll/copy mode (v select, y copy, q quit)
#   prefix r              reload this file
#   t / p                 (in the shell) workspace for this folder / pick a project
#   prefix P              pick a project in a popup and switch to it
#   prefix g              all git changes of this folder in a popup (q closes)

# Prefix: Ctrl-Space instead of Ctrl-b.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g focus-events on                 # Neovim autoread/auto-save need this
set -sg escape-time 10                 # no lag after Esc in Neovim
set -g history-limit 100000
set -g base-index 1                    # windows start at 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g allow-passthrough on            # images and OSC sequences from apps

# True colour and undercurls (Neovim diagnostics) in kitty and other terminals.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass keys like Ctrl-Enter and Shift-F5 through to Neovim.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-kitty:extkeys'

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind P display-popup -E -w 80% -h 70% "~/.local/bin/p"
bind g display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "~/.local/bin/gd"   # prefix g: all git changes

# Alt-1..9 jump straight to a window.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize panes with prefix + H/J/K/L (hold to repeat).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim keys in copy mode; y copies to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Ctrl-h/j/k/l move between panes, or between Neovim splits when Neovim has
# focus (pairs with christoomey/vim-tmux-navigator in the Neovim config).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# The shell's Ctrl-l (clear screen) moves to prefix Ctrl-l.
bind C-l send-keys C-l

# Status bar: session on the left, windows in the middle, time on the right.
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#1d2433,fg=#aeb7c6"
set -g status-left "#[bg=#44a8e5,fg=#1d2433,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#[fg=#7f8ea3]%a %d %b  %H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#c177e5,fg=#1d2433,bold] #I #W "
set -g pane-border-style "fg=#2e3a4f"
set -g pane-active-border-style "fg=#44a8e5"
set -g message-style "bg=#c177e5,fg=#1d2433"

# Plugins (TPM). prefix I installs new ones, prefix U updates them.
#   tmux-resurrect: prefix Ctrl-s saves all sessions, prefix Ctrl-r restores them.
#   tmux-continuum: saves every 15 minutes and restores after a reboot by itself.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.tmux/plugins/tpm/tpm'
