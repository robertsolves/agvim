# agent-workspace: kitty settings. kitty.conf includes this file.

# Left Option acts as Alt (Neovim/tmux Alt keys); right Option still types special characters.
macos_option_as_alt left

# Projects are the tabs along the top: one per project, each attached to that
# project's tmux session (bin/open-project). tmux sets the title to its name.
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style separator
tab_separator " │ "

# Opening kitty opens a tab for every project (startup-session.conf), restoring
# them first if the Mac restarted.
startup_session startup-session.conf
# Closing the last window quits kitty, so opening it again runs the above. The
# projects keep running in tmux.
macos_quit_when_last_window_closed yes

# open-project opens and focuses project tabs through this socket. Restart kitty
# after changing it.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-aw-{kitty_pid}

# In a project tab, Cmd-T opens a new full-screen shell tab in the project
# (tmux.conf binds Alt-T to that) instead of an empty kitty tab.
map --when-focus-on var:aw_project cmd+t send_text all \x1bT
