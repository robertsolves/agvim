# agent-workspace: kitty settings. kitty.conf includes this file.

# Left Option acts as Alt (Neovim/tmux Alt keys); right Option still types special characters.
macos_option_as_alt left

# kitty shows the projects bar (bin/projects, tmux/projects.conf): projects along
# the top, each project's tabs along the bottom. Opening kitty shows it
# (startup-session.conf), restoring the projects first if the Mac restarted.
startup_session startup-session.conf
# Closing the last window quits kitty, so opening it again runs the above. The
# projects keep running in tmux.
macos_quit_when_last_window_closed yes

# open-project opens a window with the bar through this socket when kitty is
# running without one. Restart kitty after changing it.
allow_remote_control socket-only
listen_on unix:/tmp/kitty-aw-{kitty_pid}

# In the bar's window: Cmd-T opens a new full-screen shell tab in the project
# (tmux.conf binds Alt-T to that) instead of an empty kitty tab, and
# Cmd-Shift-[ / ] go to the previous / next project (tmux/projects.conf).
map --when-focus-on var:aw_project cmd+t send_text all \x1bT
map --when-focus-on var:aw_project cmd+shift+[ send_text all \x1b{
map --when-focus-on var:aw_project cmd+shift+] send_text all \x1b}
